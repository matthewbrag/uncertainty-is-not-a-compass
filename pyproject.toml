[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forkprobe"
version = "0.1.0"
description = "Shared code for the 'Uncertainty Is Not A Compass' fork-detection experiments"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["forkprobe"]
